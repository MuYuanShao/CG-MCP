server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: spd-mcp-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spd_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:spd_app}
    password: ${SPRING_DATASOURCE_PASSWORD:replace_with_strong_app_password}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  api:
    key: ${APP_API_KEY:}
  tenant:
    default-id: ${APP_DEFAULT_TENANT_ID:1}
  audit:
    default-operator-name: ${APP_DEFAULT_OPERATOR_NAME:frontend-user}
  auth:
    admin-username: ${APP_ADMIN_USERNAME:root}
    admin-password: ${APP_ADMIN_PASSWORD:}
    token-secret: ${APP_AUTH_TOKEN_SECRET:${APP_API_KEY:}}
    token-ttl-seconds: ${APP_AUTH_TOKEN_TTL_SECONDS:1800}
    refresh-token-ttl-seconds: ${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:604800}
    refresh-cookie-name: ${APP_AUTH_REFRESH_COOKIE_NAME:root}
    refresh-cookie-secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    bootstrap-reset-password: ${APP_AUTH_BOOTSTRAP_RESET_PASSWORD:false}
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  upload:
    root-dir: ${APP_UPLOAD_ROOT_DIR:uploads}
    license-dir: ${APP_LICENSE_UPLOAD_DIR:${APP_UPLOAD_ROOT_DIR:uploads}/licenses}
  ai:
    endpoint: ${APP_AI_ENDPOINT:http://localhost:11434/api/chat}
    model: ${APP_AI_MODEL:qwen2.5:7b}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:60}
